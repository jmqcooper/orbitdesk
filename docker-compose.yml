services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbitdesk
      POSTGRES_PASSWORD: orbitdesk
      POSTGRES_DB: orbitdesk
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - orbitdesk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitdesk"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  orbitdesk_postgres:
